services:
  opencode-customs-tts:
    build:
      context: .
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      TTS_QUALITY_MODEL_ID: ${TTS_QUALITY_MODEL_ID:-silero-v5-ukrainian}
      TTS_FAST_MODEL_ID: ${TTS_FAST_MODEL_ID:-piper-ukrainian}
      TTS_MAX_INPUT_CHARS: ${TTS_MAX_INPUT_CHARS:-6000}
      TTS_CHUNK_CHARS: ${TTS_CHUNK_CHARS:-350}
      TTS_STREAM_CHUNK_CHARS: ${TTS_STREAM_CHUNK_CHARS:-110}
      TTS_CPU_THREADS: ${TTS_CPU_THREADS:-4}
      TTS_DOWNLOAD_ATTEMPTS: ${TTS_DOWNLOAD_ATTEMPTS:-2}
      TTS_DOWNLOAD_TIMEOUT_SECONDS: ${TTS_DOWNLOAD_TIMEOUT_SECONDS:-30}
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_WAKE_MODEL: ${STT_WAKE_MODEL:-tiny}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_PRE_ROLL_MS: ${STT_PRE_ROLL_MS:-700}
      STT_SILENCE_MS: ${STT_SILENCE_MS:-700}
      STT_ENDPOINT_COMMIT_MS: ${STT_ENDPOINT_COMMIT_MS:-1300}
      STT_SEMANTIC_GRACE_MS: ${STT_SEMANTIC_GRACE_MS:-1800}
      STT_SEMANTIC_MIN_SPEECH_MS: ${STT_SEMANTIC_MIN_SPEECH_MS:-1200}
      STT_PARTIAL_MS: ${STT_PARTIAL_MS:-2400}
      STT_MAX_PARTIALS: ${STT_MAX_PARTIALS:-2}
      STT_MAX_UTTERANCE_MS: ${STT_MAX_UTTERANCE_MS:-15000}
      STT_MIN_SPEECH_MS: ${STT_MIN_SPEECH_MS:-360}
      STT_MIN_RMS: ${STT_MIN_RMS:-0.0012}
      STT_MIN_FINAL_CONFIDENCE: ${STT_MIN_FINAL_CONFIDENCE:-0.58}
      STT_VAD_MODE: ${STT_VAD_MODE:-2}
      STT_STREAM_WINDOW_MS: ${STT_STREAM_WINDOW_MS:-6000}
      STT_STREAM_COMMIT_MARGIN_MS: ${STT_STREAM_COMMIT_MARGIN_MS:-1600}
      STT_WAKE_MATCH_THRESHOLD: ${STT_WAKE_MATCH_THRESHOLD:-0.78}
      STT_WAKE_COMMAND_OVERLAP_MS: ${STT_WAKE_COMMAND_OVERLAP_MS:-80}
    volumes:
      - ukrainian-tts-cache:/home/tts/.cache
      - ./models:/models:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: 6

volumes:
  ukrainian-tts-cache:
